# ============================================================
# 飞书群聊采集 - Nginx 反向代理配置(HTTPS)
# 作用: 把公网 HTTPS 请求代理到本机 127.0.0.1:8008 的 FastAPI 服务
#
# 用法:
#   1. 替换 your-domain.com 为你的真实域名
#   2. 把本文件放到 /etc/nginx/sites-available/feishu-message
#   3. 软链到 sites-enabled 并重载:  ln -s ... ; nginx -t && nginx -s reload
#   4. 用 certbot 申请 HTTPS 证书(见部署文档)
# ============================================================

server {
    listen 80;
    server_name your-domain.com;

    # HTTP -> HTTPS 强制跳转
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name your-domain.com;

    # --- HTTPS 证书(certbot 自动生成后填入) ---
    ssl_certificate     /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # --- 简单安全头 ---
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;

    # 请求体上限(飞书消息事件可能较大)
    client_max_body_size 10m;

    # 健康检查(不加缓存,方便监控)
    location = /health {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
    }

    # 飞书事件回调(核心)
    location /feishu/ {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 其余(可选)
    location / {
        proxy_pass http://127.0.0.1:8008;
        proxy_set_header Host $host;
    }
}
